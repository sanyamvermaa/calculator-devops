# nginx/nginx.conf

# NOTE: the upstream name must not contain an underscore. nginx sends it as the
# Host header when proxy_pass targets an upstream, and Tomcat rejects hostnames
# containing '_' with HTTP 400.
upstream calc-backend {
    server calculator:8080;   # 'calculator' is the service name in compose
}

server {
    listen 80 default_server;
    server_name _;

    # Pass the API through
    location /api/ {
        proxy_pass         http://calc-backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Also pass the health endpoint through for external monitoring.
    # The Jenkins Deploy stage curls this to verify the rollout.
    location /actuator/ {
        proxy_pass         http://calc-backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # A tiny landing page so hitting / in a browser shows something nice
    location / {
        default_type text/html;
        return 200 '<h1>Calculator DevOps</h1><p>Try <a href="/api/v1/add?a=2&b=3">/api/v1/add?a=2&b=3</a></p>';
    }
}
